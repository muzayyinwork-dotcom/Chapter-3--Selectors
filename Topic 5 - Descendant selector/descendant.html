<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    div h2 {
      color: purple;
    }
    div p {
      color: green;
    }
    section p {
      color: blue;
    }
  </style>
  <body>
    <div>
      <h2>Inside Div</h2>
      <p>This paragraph is inside the div.</p>
    </div>

    <h2>Outside Div</h2>
    <p>This paragraph is outside the div.</p>

    <section>
      <p>This paragraph is inside the section.</p>
    </section>
  </body>
</html>

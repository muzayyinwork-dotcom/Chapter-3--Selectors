<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Selectors</title>
    <style>
      .highlight {
        background: yellow;
        color: black;
      }

      .primary {
        background: blue;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>My Portfolio</h1>

    <p class="highlight">I am learning CSS.</p>
    <p>This is a normal paragraph.</p>
    <p class="highlight">I am practicing selectors.</p>

    <button class="primary">Contact Me</button>
    <button>Learn More</button>
  </body>
</html>
